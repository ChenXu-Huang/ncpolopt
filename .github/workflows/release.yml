name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: 3.13
          enable-cache: true

      - name: Verify tag matches package version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}"
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/

      - name: Extract changelog for release
        id: changelog
        run: |
          CLEAN_VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$CLEAN_VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") found=1
            }
            found
          ' docs/CHANGELOG.md > release_body.md
          grep "^\\[$CLEAN_VERSION\\]:" docs/CHANGELOG.md >> release_body.md

          if [ ! -s release_body.md ]; then
            echo "## Changelog" > release_body.md
            echo "Release for version ${{ github.ref_name }}. (No matching changelog entry found in CHANGELOG.md)" >> release_body.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
